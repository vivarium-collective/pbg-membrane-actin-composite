schema_version: 4
name: fixed-boundary
investigation: membrane-actin-ratchet
title: "Rung 1 · Fixed boundary"
claim: "OBSERVED (partial pass): against an immovable wall mean barrier_velocity = 0 (within ±1e-3) while contact force accumulates. Quantitative match to the Peskin ratchet rate still pending a digitized reference."
confidence: Investigating
evidence_status: observed-partial
decision_figure: "tip–wall gap distribution + contact-force accumulation, with Peskin (1993) expected ratchet rate overlaid"
expected_pattern: "barrier_velocity ≈ 0; contact_force accumulates; tip–wall gap distribution consistent with thermal-fluctuation ratchet"
acceptance_threshold: "mean barrier_velocity within ±1e-3 AND contact_force > 0 and rising; gap stats within Peskin band"
parent_studies: []
created: '2026-05-18'
question: Does the composite reproduce the rigid-wall Peskin-1993 regime — Brownian-ratchet kinetics against
  an immovable boundary — to within numerical tolerance, when barrier_kind is "fixed"?
phase: Design
design_status: drafted
implementation_status: complete
simulation_status: ran
evaluation_status: not_evaluated
gate_status: null
expert_review_status: not_requested
purpose:
  question: Does the composite reproduce the rigid-wall Peskin-1993 regime — Brownian-ratchet kinetics
    against an immovable boundary — to within numerical tolerance, when barrier_kind is "fixed"?
  mechanism: The coupler publishes a fixed wall_z to ReaDDy; actin filaments confined under the wall accumulate
    contact_force; barrier_velocity stays at zero by construction.
  expected_outcome: contact_force builds up; barrier_velocity ≈ 0; the F-V scatter point sits at velocity≈0,
    force=mean_contact_force.
conditions:
  baseline:
    composite: pbg_membrane_actin_composite.composites.rung1_fixed_boundary
    params: {}
  variants:
  - name: low-growth
    description: Slow polymerization — fewer ratchet events against the fixed wall.
    parameter_overrides:
      growth_rate: 1.0
  - name: high-growth
    description: Fast polymerization — higher contact_force buildup at the fixed wall.
    parameter_overrides:
      growth_rate: 8.0
  model_settings: []
tests:
- name: fv-matches-mogilner-baseline
  question: Mean barrier velocity stays at zero (within 1e-3) and mean contact_force is positive across
    the run, consistent with the rigid-wall ratchet regime.
  given:
    run: baseline
    window: second_half
  measure:
    kind: listener_path
    observable: barrier_velocity
    reduce: mean
  pass_if:
    op: in_range
    lo: -0.001
    hi: 0.001
  status: stub
expert_docs:
- multiscale-brownian-ratchet-spec
visualizations:
- name: gap-contact-decision
  address: local:GapContactDecision
  config:
    study_slug: fixed-boundary
- name: coupling-trace
  address: local:CouplingTrace
- name: population-trace
  address: local:PopulationTrace
- name: barrier-kinematics
  address: local:BarrierKinematics
- name: ratchet-event-rate
  address: local:RatchetEventRate
- name: particles-3d
  address: local:Particles3D
  config:
    study_slug: fixed-boundary
model_change:
  base_model: pbg_membrane_actin_composite.composites.rung1_fixed_boundary
  new_processes:
  - name: BrownianRatchetCoupler
    kind: Process
    requirement_id: coupler-fixed
  - name: ReaDDyProcess
    kind: Process
  new_parameters:
  - name: barrier_kind
    default: fixed
    units: categorical
  - name: force_constant
    default: 2.0
    units: au · force/length
  - name: contact_threshold
    default: 0.4
    units: au
  notes: Spec §2.2 rung 1. Wall held at fixed z; no membrane process. ReaDDy actin
    filaments push against the wall via the coupler.
simulation_set:
- kind: single
  name: rung1-fixed
  base_model: pbg_membrane_actin_composite.composites.rung1_fixed_boundary
  description: Single closed-loop run with the wall held fixed at z=0. 16 composite
    steps, interval=0.5.

discovery_implications:
  mechanism_uncertainty_addressed:
  - Does an immovable barrier produce pure force accumulation with no advance (the classical rigid-wall
    ratchet limit)?
  resolved_uncertainties:
  - Against a fixed wall the barrier velocity holds at ~0 while contact force accumulates (OBSERVED).
  remaining_uncertainties:
  - Whether the gap-distribution / ratchet event rate quantitatively match Peskin (1993) — not yet compared
    to theory.
  alternate_hypotheses:
  - statement: The accumulating contact_force is an artefact of wall stiffness (force_constant), not genuine
      Brownian-ratchet rectification.
    evidence_for:
    - contact_force scales with force_constant by construction.
    evidence_against:
    - barrier_velocity ~0 and a thermal-fluctuation-shaped gap distribution would argue for true ratcheting.
    discriminating_observables:
    - tip-wall gap distribution shape
    - ratchet event rate vs growth_rate
  mechanism_update_proposals:
  - mechanism_elements_affected:
    - fixed-barrier → force-accumulation node
    update_type: confirm
    confidence_change: increase
    statement: 'Confirms the rigid-wall baseline: a fixed barrier converts polymerization into accumulated
      force, not motion.'
  followup_study_proposals:
  - title: Quantify the tip-wall gap distribution against Peskin theory
    expected_information_gain: Turns the OBSERVED velocity~0 into a VALIDATED match (or refutation) of
      the rigid-wall ratchet rate.
    mechanism_elements_affected:
    - fixed-barrier ratchet node
    discriminating_observables:
    - gap histogram
    - contact_force accumulation slope
