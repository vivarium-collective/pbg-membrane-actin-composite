schema_version: 4
name: rigid-movable-boundary
investigation: membrane-actin-ratchet
title: "Rung 2 · Rigid movable boundary"
claim: "A drag-loaded movable wall settles to a non-zero velocity, exhibiting load-dependent stalling within the Peskin-1993 bound."
confidence: Investigating
parent_studies:
  - {study: fixed-boundary, condition: tests-passed}
created: '2026-05-18'
question: With barrier_kind="rigid_movable", does the wall translate at a velocity proportional to the
  mean contact force (drag-balance Peskin 1993 setup), and does the stall force remain bounded?
phase: Design
design_status: drafted
implementation_status: complete
simulation_status: ran
evaluation_status: not_evaluated
gate_status: blocked
expert_review_status: not_requested
purpose:
  question: With barrier_kind="rigid_movable", does the wall translate at a velocity proportional to the
    mean contact force (drag-balance Peskin 1993 setup), and does the stall force remain bounded?
  mechanism: The wall obeys dz/dt = F/drag while staying planar (no deformation). Same actin model as
    the fixed-boundary rung; only the barrier's response changes.
  expected_outcome: barrier_velocity stabilizes at a non-zero value over the second half of the run; stall
    force ≤ Peskin closed-form upper bound at this drag.
conditions:
  baseline:
    composite: pbg_membrane_actin_composite.composites.rung2_rigid_movable_boundary
    params: {}
  variants:
  - name: low-drag
    description: Light wall — faster barrier velocity, lower stall force.
    parameter_overrides:
      barrier_drag: 2.0
  - name: high-drag
    description: Heavy wall — approaches the Peskin stall regime.
    parameter_overrides:
      barrier_drag: 16.0
  model_settings: []
tests:
- name: stall-force-within-peskin-bound
  question: Mean barrier_velocity over the second half is positive (wall is moving) and below the zero-load
    Peskin velocity ceiling.
  given:
    run: baseline
    window: second_half
  measure:
    kind: listener_path
    observable: barrier_velocity
    reduce: mean
  pass_if:
    op: in_range
    lo: 0.001
    hi: 5.0
  status: stub
