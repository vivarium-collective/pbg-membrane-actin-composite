schema_version: 4
name: coupled-ratchet-cycle-fv-reproduction
investigation: membrane-actin-ratchet
title: "Benchmark · Coupled force–velocity reproduction"
claim: "TARGET (not yet tested): the closed loop reproduces the Inoue-2015 concave→convex F-V transition. No benchmark comparison has been run."
confidence: Investigating
evidence_status: not-tested
decision_figure: "F-V curve overlaid directly on the Inoue (2015) reference, with replicate runs + uncertainty bands, a fitted curve quantifying the concave→convex transition, and coupler-prerequisite pass indicators"
decision_figure_viz: force-velocity-benchmark
expected_pattern: "F-V curvature flips concave→convex as growth_rate increases, tracking the Inoue 2015 shape"
acceptance_threshold: "quantified curvature sign-flip across the growth_rate sweep, within the Inoue reference band"
parent_studies:
  - {study: flexible-mem3dg-boundary, condition: tests-passed}
created: '2026-05-18'
question: Does the closed-loop coupled cycle reproduce the Inoue-2015 concave→convex F-V transition as
  polymerization rate varies — the headline numerical benchmark for a flexible-membrane ratchet (spec
  §1.2)?
phase: Design
design_status: drafted
implementation_status: complete
simulation_status: ran
evaluation_status: not_evaluated
gate_status: null
expert_review_status: not_requested
purpose:
  question: Does the closed-loop coupled cycle reproduce the Inoue-2015 concave→convex F-V transition
    as polymerization rate varies — the headline numerical benchmark for a flexible-membrane ratchet (spec
    §1.2)?
  mechanism: 'Sweep growth_rate across the regime where the F-V curve shape flips: at low rates the curve
    is concave (monomer-delivery limited); at high rates it goes convex (filament-dominated). The flexible
    barrier is the only rung where this transition can emerge — rigid rungs give a single F-V scatter
    point per growth_rate, not the transition.'
  expected_outcome: 'Across the sweep, the (F, V) scatter cloud is non-monotonic in curvature: concave
    at low growth_rate, convex at high growth_rate.'
conditions:
  baseline:
    composite: pbg_membrane_actin_composite.composites.rung3_flexible_mem3dg_boundary
    params: {}
  variants:
  - name: low-growth
    description: Low polymerization rate — expect concave F-V branch.
    parameter_overrides:
      growth_rate: 1.0
  - name: high-growth
    description: High polymerization rate — expect convex F-V branch.
    parameter_overrides:
      growth_rate: 8.0
  model_settings: []
tests:
- name: concave-to-convex-fv-transition-emerges
  question: The (force, velocity) scatter cloud crosses from concave to convex as growth_rate increases
    across the variants, matching Inoue 2015 fig. 5.
  given:
    run: variant
    variant: high-growth
    window: second_half
  measure:
    kind: listener_path
    observable: barrier_velocity
    reduce: mean
  pass_if:
    op: ratio_at_least
    ratio: 2.0
    compared_to:
      run: variant
      variant: low-growth
  status: stub
