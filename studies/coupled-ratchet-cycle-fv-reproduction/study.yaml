schema_version: 4
name: coupled-ratchet-cycle-fv-reproduction
investigation: membrane-actin-ratchet
title: "Benchmark · Coupled force–velocity reproduction"
claim: "TARGET (not yet tested): the closed loop reproduces the Inoue-2015 concave→convex F-V transition. No benchmark comparison has been run."
confidence: Investigating
evidence_status: not-tested
decision_figure: "F-V curve overlaid directly on the Inoue (2015) reference, with replicate runs + uncertainty bands, a fitted curve quantifying the concave→convex transition, and coupler-prerequisite pass indicators"
expected_pattern: "F-V curvature flips concave→convex as growth_rate increases, tracking the Inoue 2015 shape"
acceptance_threshold: "quantified curvature sign-flip across the growth_rate sweep, within the Inoue reference band"
parent_studies:
  - {study: flexible-mem3dg-boundary, condition: tests-passed}
created: '2026-05-18'
question: Does the closed-loop coupled cycle reproduce the Inoue-2015 concave→convex F-V transition as
  polymerization rate varies — the headline numerical benchmark for a flexible-membrane ratchet (spec
  §1.2)?
phase: Design
design_status: drafted
implementation_status: complete
simulation_status: ran
evaluation_status: not_evaluated
gate_status: null
expert_review_status: not_requested
purpose:
  question: Does the closed-loop coupled cycle reproduce the Inoue-2015 concave→convex F-V transition
    as polymerization rate varies — the headline numerical benchmark for a flexible-membrane ratchet (spec
    §1.2)?
  mechanism: 'Sweep growth_rate across the regime where the F-V curve shape flips: at low rates the curve
    is concave (monomer-delivery limited); at high rates it goes convex (filament-dominated). The flexible
    barrier is the only rung where this transition can emerge — rigid rungs give a single F-V scatter
    point per growth_rate, not the transition.'
  expected_outcome: 'Across the sweep, the (F, V) scatter cloud is non-monotonic in curvature: concave
    at low growth_rate, convex at high growth_rate.'
conditions:
  baseline:
    composite: pbg_membrane_actin_composite.composites.rung3_flexible_mem3dg_boundary
    params: {}
  variants:
  - name: low-growth
    description: Low polymerization rate — expect concave F-V branch.
    parameter_overrides:
      growth_rate: 1.0
  - name: high-growth
    description: High polymerization rate — expect convex F-V branch.
    parameter_overrides:
      growth_rate: 8.0
  model_settings: []
tests:
- name: concave-to-convex-fv-transition-emerges
  question: The (force, velocity) scatter cloud crosses from concave to convex as growth_rate increases
    across the variants, matching Inoue 2015 fig. 5.
  given:
    run: variant
    variant: high-growth
    window: second_half
  measure:
    kind: listener_path
    observable: barrier_velocity
    reduce: mean
  pass_if:
    op: ratio_at_least
    ratio: 2.0
    compared_to:
      run: variant
      variant: low-growth
  status: stub
expert_docs:
- multiscale-brownian-ratchet-spec
visualizations:
- name: force-velocity-benchmark
  address: local:ForceVelocityBenchmark
  config:
    study_slug: coupled-ratchet-cycle-fv-reproduction
- name: force-velocity-scatter
  address: local:ForceVelocityScatter
- name: coupling-trace
  address: local:CouplingTrace
- name: barrier-kinematics
  address: local:BarrierKinematics
- name: energy-budget
  address: local:EnergyBudget
- name: membrane-volume-strain
  address: local:MembraneVolumeStrain
- name: population-trace
  address: local:PopulationTrace
- name: ratchet-event-rate
  address: local:RatchetEventRate
- name: schematic-vesicle-3d
  address: local:SchematicVesicle3D
- name: particles-3d
  address: local:Particles3D
  config:
    study_slug: coupled-ratchet-cycle-fv-reproduction
pipeline_gate:
  prerequisites:
  - actin-to-membrane-force-handshake
  - membrane-to-actin-displacement-feedback
model_change:
  base_model: pbg_membrane_actin_composite.composites.rung3_flexible_mem3dg_boundary
  new_parameters:
  - name: growth_rate
    default: 4.0
    units: events/time
    description: Actin polymerization rate. Sweep this to surface the Inoue 2015 concave→convex
      F-V transition.
  notes: Sweep growth_rate across the regime where the F-V curve shape flips. Reproduces
    the spec §1.2 primary numerical benchmark.
simulation_set:
- kind: single
  name: coupled-cycle-flexible
  base_model: pbg_membrane_actin_composite.composites.rung3_flexible_mem3dg_boundary
  description: Baseline run at growth_rate=4.0 (mid-regime).
- kind: sweep
  name: growth-rate-fv-sweep
  base_model: pbg_membrane_actin_composite.composites.rung3_flexible_mem3dg_boundary
  axes:
  - parameter: growth_rate
    values:
    - 1.0
    - 4.0
    - 8.0
  description: Three-point growth_rate sweep to surface the concave→convex F-V transition
    (Inoue 2015 fig. 5).

discovery_implications:
  mechanism_uncertainty_addressed: Does the closed loop reproduce the Inoue-2015 concave→convex F-V transition
    that distinguishes a flexible-membrane ratchet?
  resolved_uncertainties: []
  remaining_uncertainties:
  - The concave→convex transition has not been measured; growth_rate is not recorded in run params so
    the sweep cannot be separated; no Inoue-2015 overlay yet.
  alternate_hypotheses:
  - statement: Any F-V shape change is an artefact of the coupler gain / osmotic mapping rather than genuine
      flexible-membrane ratchet physics.
    evidence_for:
    - osmotic_offset = contact_force/area shapes the response.
    evidence_against:
    - a curvature sign-flip that tracks Inoue 2015 across a real growth_rate sweep would argue for the
      physics.
    discriminating_observables:
    - F-V curvature vs growth_rate
    - overlay on Inoue 2015 reference
  mechanism_update_proposals:
  - mechanism_elements_affected:
    - flexible-membrane → concave→convex F-V transition (headline benchmark)
    update_type: open
    confidence_change: unchanged
    statement: The diagnostic transition is asserted by construction; measuring it is the headline open
      test.
  followup_study_proposals:
  - title: Record growth_rate in run params, run the sweep, and overlay the Inoue-2015 reference
    expected_information_gain: The headline VALIDATED/REFUTED verdict for the flexible-membrane ratchet.
    mechanism_elements_affected:
    - F-V transition benchmark
    discriminating_observables:
    - fitted F-V curvature across growth_rate
    - distance to Inoue 2015 band
