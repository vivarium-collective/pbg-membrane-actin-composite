schema_version: 4
name: flexible-mem3dg-boundary
investigation: membrane-actin-ratchet
title: "Rung 3 · Flexible Mem3DG boundary"
claim: "OBSERVED: under actin pressure the vesicle inflates. That load is redistributed across filaments / relaxed off the rigid curve is NOT yet quantified — inflation alone is not ratchet success."
confidence: Investigating
system_figure_viz: particles-3d
evidence_status: observed-partial
decision_figure: "rigid-vs-flexible side-by-side curvature & deformation maps (identical camera and scale) with the undeformed reference overlaid, plus per-filament load redistribution"
expected_pattern: "membrane deforms; curvature redistributes load; mean per-tip contact force drops vs the rigid rung; volume ↑ ≥ 10%"
acceptance_threshold: "membrane_volume ratio ≥ 1.1 AND mean per-tip contact_force < rigid-movable baseline"
parent_studies:
  - {study: rigid-movable-boundary, condition: tests-passed}
  - {study: actin-to-membrane-force-handshake, condition: tests-passed}
  - {study: membrane-to-actin-displacement-feedback, condition: tests-passed}
created: '2026-05-18'
question: With barrier_kind="flexible" (closed-icosphere Mem3DG mesh inside-pushed by bonded actin filaments),
  does the membrane deform under actin pressure and relax the contact-force burden compared to the rigid_movable
  rung?
phase: Design
design_status: drafted
implementation_status: complete
simulation_status: ran
evaluation_status: not_evaluated
gate_status: null
expert_review_status: not_requested
purpose:
  question: With barrier_kind="flexible" (closed-icosphere Mem3DG mesh inside-pushed by bonded actin filaments),
    does the membrane deform under actin pressure and relax the contact-force burden compared to the rigid_movable
    rung?
  mechanism: 'Spec §2.2 rung 3. The coupler runs full Mem3DG: actin tip positions raise contact_force
    on the inner surface; mem3dg integrates the resulting osmotic_offset; the vesicle inflates, distributing
    load across the mesh and shifting the F-V scatter point off the rigid-wall curve.'
  expected_outcome: Vesicle volume grows visibly (≥10%) over the run; mean barrier expansion rate is positive;
    F-V scatter lies clearly off the rung-2 line.
conditions:
  baseline:
    composite: pbg_membrane_actin_composite.composites.rung3_flexible_mem3dg_boundary
    params: {}
  variants:
  - name: soft-coupling
    description: Weak osmotic gain — membrane barely inflates, load stays on actin.
    parameter_overrides:
      osmotic_force_scale: 0.02
  - name: stiff-coupling
    description: Strong osmotic gain — vesicle inflates fast, relaxing contact force.
    parameter_overrides:
      osmotic_force_scale: 0.1
  model_settings: []
tests:
- name: membrane-curvature-relaxes-load
  question: Membrane volume increases by ≥10% over the run (vesicle inflates under actin pressure) and
    final mean contact_force is below the rung-1 mean.
  given:
    run: baseline
    window: full
  measure:
    kind: listener_path
    observable: membrane_volume
    reduce: first_and_last
  pass_if:
    op: ratio_at_least
    ratio: 1.1
  status: stub
expert_docs:
- multiscale-brownian-ratchet-spec
visualizations:
- name: coupling-trace
  address: local:CouplingTrace
- name: backpressure-trace
  address: local:BackpressureTrace
- name: population-trace
  address: local:PopulationTrace
- name: barrier-kinematics
  address: local:BarrierKinematics
- name: energy-budget
  address: local:EnergyBudget
- name: membrane-volume-strain
  address: local:MembraneVolumeStrain
- name: ratchet-event-rate
  address: local:RatchetEventRate
- name: force-velocity-scatter
  address: local:ForceVelocityScatter
- name: schematic-vesicle-3d
  address: local:SchematicVesicle3D
- name: particles-3d
  address: local:Particles3D
  config:
    study_slug: flexible-mem3dg-boundary
pipeline_gate:
  prerequisites:
  - rigid-movable-boundary
model_change:
  base_model: pbg_membrane_actin_composite.composites.rung3_flexible_mem3dg_boundary
  new_processes:
  - name: Mem3DGProcess
    kind: Process
    requirement_id: mem3dg-vesicle
  - name: BrownianRatchetCoupler
    kind: Process
    requirement_id: coupler-flexible
  new_parameters:
  - name: barrier_kind
    default: flexible
    units: categorical
  - name: membrane_geometry
    default: icosphere
  - name: osmotic_force_scale
    default: 0.05
    units: au · pressure
  - name: force_constant
    default: 5.0
    units: au · force/length
  notes: Spec §2.2 rung 3 (Phase-2 endpoint). Closed Mem3DG icosphere vesicle inflates
    under actin contact force translated through osmotic_strength_offset.
simulation_set:
- kind: single
  name: rung3-flexible
  base_model: pbg_membrane_actin_composite.composites.rung3_flexible_mem3dg_boundary
  description: 'Closed-loop coupled run: ReaDDy actin pushes against a Mem3DG icosphere;
    coupler publishes osmotic_offset every step.'
